# dsh-waypoint host bundle.
#
# One row owns the host registry, SSH tunnels, plugin-owned remote
# provisioning, the local model credential proxy, and the authenticated host
# API. Its browser half registers the Settings page and remote chat drawer.
#
# The stock terminal-controller row is left alone: it provides the
# `terminalController` service, and this plugin routes that service's methods per
# Session instead of replacing it. Disabling it here while a bundled fork failed
# to load left the Host with no terminal service at all.
- insert:
    - id: dsh-waypoint
      name: dsh-waypoint
      config:
        # Empty means $DSH_HOME/waypoint.
        stateDir: ''
        sshBinary: ssh
        # Empty means ~/.ssh/config. Settings offers the aliases found here.
        sshConfigPath: ''
        # Empty means <remoteDshHome>/waypoint-agent/agent.json.
        remoteStateFile: ''
        probeTimeoutMs: 10000
        connectTimeoutMs: 15000
        healthIntervalMs: 15000
        reconnect: true
        maxReconnectDelayMs: 30000
        # Automatic reconnect attempts before the card stops and waits for a
        # person. An uncapped backoff makes a permanent failure (no Node.js)
        # look transient forever.
        provisionRetryLimit: 3
        strictHostKeyChecking: accept-new

        # One-click remote provisioning.
        autoProvision: true
        remoteDshHome: ~/.dsh
        # Global npm prefix that owns the remote `dsh` command.
        # Empty means `npm prefix -g`; there is no fallback location.
        remoteGlobalPrefix: ''
        # Empty means use the local DSH runtime version.
        remoteDshVersion: ''
        remotePnpmVersion: 11.21.0
        remoteStart: systemd
        provisionTimeoutMs: 600000
        # Remote-visible HTTP(S) proxy. Empty means inspect the account login shell.
        remoteInstallProxy: ''
        remoteInstallNoProxy: 127.0.0.1,localhost

        # Default: copy the locally resolved key into the remote service env.
        credentialProxy: false
        copyModelKey: true
        remoteModelBaseUrl: https://api.deepseek.com/anthropic

        # Optional: keep the key local and proxy through a reverse SSH tunnel.
        credentialProxyUpstream: https://api.deepseek.com/anthropic
        credentialProxyRemotePort: 47821
        modelCredentialRef: DEEPSEEK_API_KEY

        # Mirror remote workspaces/sessions into the ordinary local UI.
        mirrorSessions: true
        mirrorPollMs: 1500
        mirrorMaxEvents: 2000
