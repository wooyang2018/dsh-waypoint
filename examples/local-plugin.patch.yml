# Example: local plugin profile patch
#
# The bundle already inserts the row; this patch can override defaults.
# Every key the plugin's schema accepts appears below, in schema order.
# `remoteDshVersion` is shown commented out because an empty value means
# "follow the local DSH version", which is the default.
- id: dsh-waypoint
  config:
    stateDir: ~/.dsh/remote
    sshBinary: ssh
    # Empty pairs scp with sshBinary.
    scpBinary: ''
    # Empty means ~/.ssh/config.
    sshConfigPath: ''
    remoteStateFile: ''
    probeTimeoutMs: 10000
    connectTimeoutMs: 15000
    healthIntervalMs: 15000
    reconnect: true
    maxReconnectDelayMs: 30000
    # Automatic reconnect attempts before the card stops and waits for a person.
    provisionRetryLimit: 3
    strictHostKeyChecking: accept-new

    autoProvision: true
    remoteDshHome: ~/.dsh
    # Global npm prefix that owns the remote `dsh` command.
    # Empty means `npm prefix -g`; there is no fallback location.
    remoteGlobalPrefix: ''
    # remoteDshVersion: 0.2.2-rc.3  # pin a remote DSH version; omit to follow the local DSH version
    remotePnpmVersion: 11.21.0
    # Node.js is detected through the account's own shell and never installed by
    # provisioning. Settings offers "远端 Node.js → 安装" (nvm + latest LTS) for
    # a host that has none or an outdated one.
    remoteInstallProxy: ''
    remoteInstallNoProxy: 127.0.0.1,localhost
    remoteStart: systemd
    provisionTimeoutMs: 600000

    # Profile-wide seed for hosts that never chose a model key source.
    # A per-host choice made in Settings wins over these two.
    credentialProxy: false
    copyModelKey: true
    remoteModelBaseUrl: https://api.deepseek.com/anthropic

    # Proxy-mode endpoint used when a host (or the seed above) selects proxy:
    credentialProxyUpstream: https://api.deepseek.com/anthropic
    credentialProxyRemotePort: 47821
    modelCredentialRef: DEEPSEEK_API_KEY

    mirrorSessions: true
    mirrorPollMs: 1500
    mirrorMaxEvents: 2000
