name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing
        run: npm install --global npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Reject prerelease remote agent
        run: |
          VERSION="$(node -p "require('./packages/remote-agent/package.json').version")"
          case "$VERSION" in
            *-*) echo "::error::Refusing to release prerelease remote agent $VERSION"; exit 1 ;;
          esac
      - name: Build the installable bundle
        id: pack
        run: |
          # `--release` keeps the manifest version. Without it the packer stamps
          # a unique `-dev-<stamp>-<random>` prerelease, which is what a local
          # iteration wants and what a published release must never be: the tag
          # check below would fail, and a `latest` tag would carry a prerelease.
          TARBALL="$(node scripts/release-plugin.mjs --release)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          test -f "$TARBALL"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./packages/local-plugin/package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      - name: Check whether npm publishing is configured
        id: npm
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set; this run publishes the GitHub release only. Add the secret and re-run to stage the npm packages."
          fi
      - name: Check whether this version is already published
        id: published
        if: steps.npm.outputs.ready == 'true'
        run: |
          VERSION="$(node -p "require('./packages/local-plugin/package.json').version")"
          if npm view "dsh-waypoint@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether the remote agent version is already published
        id: agent-published
        if: steps.npm.outputs.ready == 'true'
        run: |
          VERSION="$(node -p "require('./packages/remote-agent/package.json').version")"
          if npm view "dsh-waypoint-agent@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage remote agent tarball
        if: steps.npm.outputs.ready == 'true' && steps.agent-published.outputs.exists != 'true'
        run: |
          npm stage publish packages/local-plugin/assets/dsh-waypoint-agent-*.tgz --tag latest --access public --provenance
          echo "::notice::Remote agent staged. Approve it with 2FA: npm stage list dsh-waypoint-agent"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Stage local plugin tarball
        if: steps.npm.outputs.ready == 'true' && steps.published.outputs.exists != 'true'
        run: |
          npm stage publish packages/local-plugin/dsh-waypoint-*.tgz --tag latest --access public --provenance
          echo "::notice::npm package staged. Approve it with 2FA: npm stage list dsh-waypoint && npm stage approve <stage-id>"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Stage terminal controller tarball
        if: steps.npm.outputs.ready == 'true' && steps.published.outputs.exists != 'true'
        run: |
          # The plugin bundles this package, so it is not required at install
          # time; publishing it keeps the bundled dependency resolvable for
          # anyone reading the manifest. `release-plugin.mjs` only copies it into
          # the plugin's node_modules, so pack a standalone copy here.
          (cd packages/terminal-controller && npm pack --silent --ignore-scripts --pack-destination .)
          npm stage publish packages/terminal-controller/dsh-waypoint-terminal-controller-*.tgz --tag latest --access public --provenance
          echo "::notice::Terminal controller staged. Approve it with 2FA: npm stage list dsh-waypoint-terminal-controller"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The plugin-market entry points at `releases/latest/download/dsh-waypoint.tgz`.
      # `latest/download/` resolves `latest` at request time but takes the file
      # name literally, so a versioned asset name would 404 the moment the next
      # release is cut — silently, and least of all to us. Publish a
      # version-free copy for that URL and keep the versioned one for humans.
      - name: Prepare the version-free install asset
        run: |
          # Use the path the packer actually produced rather than reconstructing
          # it from the manifest: a dev-stamped tarball name would silently
          # break this copy, and the release asset is what the plugin-market
          # entry downloads.
          cp "${{ steps.pack.outputs.tarball }}" "$RUNNER_TEMP/dsh-waypoint.tgz"
          ls -l "$RUNNER_TEMP/dsh-waypoint.tgz"
      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            packages/local-plugin/dsh-waypoint-*.tgz
            packages/local-plugin/assets/dsh-waypoint-agent-*.tgz
            ${{ runner.temp }}/dsh-waypoint.tgz
