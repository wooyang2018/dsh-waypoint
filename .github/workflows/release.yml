name: Release

# Builds the tag's artifacts and attaches them to the GitHub release.
#
# npm publishing is not here: it runs on a maintainer's machine
# (`pnpm release:publish`), which also verifies each published tarball is
# downloadable before reporting success.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # Root forms, not `pnpm -r`: `-r` skips the root package, which is where
      # `scripts/`'s checkJs pass and the `scripts/**/*.test.mjs` live. Release
      # must not be gated more weakly than CI, which already runs the root form.
      - run: pnpm typecheck
      - run: pnpm test
      - name: Reject prerelease remote agent
        run: |
          VERSION="$(node -p "require('./packages/remote-agent/package.json').version")"
          case "$VERSION" in
            *-*) echo "::error::Refusing to release prerelease remote agent $VERSION"; exit 1 ;;
          esac
      - name: Build the installable bundle
        id: pack
        run: |
          # `pnpm -r build` packs the remote agent with a `-dev-<stamp>` version,
          # which is right while iterating and wrong in a published artifact: the
          # agent inside the plugin reports that string as its runtime version,
          # and the remote host's install decision is keyed on it. Re-pack it at
          # the manifest version before the plugin copies it in.
          node scripts/build/package-agent.mjs --release
          # `--release` keeps the manifest version. Without it the packer stamps
          # a unique `-dev-<stamp>-<random>` prerelease, which is what a local
          # iteration wants and what a published release must never be: the tag
          # check below would fail.
          TARBALL="$(node scripts/release/release-plugin.mjs --release)"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          test -f "$TARBALL"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(node -p "require('./packages/local-plugin/package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      # The plugin-market entry points at `releases/latest/download/dsh-waypoint.tgz`.
      # `latest/download/` resolves `latest` at request time but takes the file
      # name literally, so a versioned asset name would 404 the moment the next
      # release is cut — silently, and least of all to us. Publish a
      # version-free copy for that URL and keep the versioned one for humans.
      - name: Prepare the version-free install asset
        run: |
          # Use the path the packer actually produced rather than reconstructing
          # it from the manifest: a dev-stamped tarball name would silently
          # break this copy, and the release asset is what the plugin-market
          # entry downloads.
          cp "${{ steps.pack.outputs.tarball }}" "$RUNNER_TEMP/dsh-waypoint.tgz"
          ls -l "$RUNNER_TEMP/dsh-waypoint.tgz"
      - name: Upload GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            packages/local-plugin/dsh-waypoint-*.tgz
            packages/local-plugin/assets/dsh-waypoint-agent-*.tgz
            ${{ runner.temp }}/dsh-waypoint.tgz
